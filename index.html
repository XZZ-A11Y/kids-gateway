<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上网认证</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.95); border-radius: 20px; padding: 40px;
            max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; margin-bottom: 8px; color: #333; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
            border-radius: 10px; font-size: 16px; transition: border-color .2s;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: transform .1s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-success { background: #4caf50; color: white; margin-top: 10px; }
        .btn-danger { background: #f44336; color: white; margin-top: 10px; }
        .countdown {
            text-align: center; font-size: 48px; font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0;
        }
        .status { text-align: center; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .status.online { background: #e8f5e9; color: #2e7d32; }
        .hidden { display: none; }
        .admin-link {
            position: fixed; bottom: 10px; right: 10px;
            font-size: 10px; color: rgba(255,255,255,0.3); cursor: pointer;
        }
        .admin-panel { background: #f5f5f5; border-radius: 10px; padding: 20px; margin-top: 20px; }
        .admin-panel h3 { margin-bottom: 10px; }
        .log-entry { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ 上网认证</h1>
        <p class="subtitle">请登录以获取上网权限</p>

        <div id="loginView">
            <div class="form-group">
                <label>账号</label>
                <input id="username" value="小猪猪" readonly>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="password" type="password" value="ZhuZhu@2026">
            </div>
            <div class="form-group">
                <label>上网时长（分钟）</label>
                <input id="duration" type="number" value="60" min="10" max="300">
            </div>
            <button class="btn-primary" onclick="doLogin()">🚀 立即上网</button>
            <p id="msg" style="text-align:center;margin-top:10px;color:#f44336;"></p>
        </div>

        <div id="authView" class="hidden">
            <div class="status online">✅ 已获得上网权限</div>
            <div class="countdown" id="countdown">--:--</div>
            <p style="text-align:center;color:#666;margin-bottom:15px;">剩余上网时间</p>
            <button class="btn-success" onclick="doRenew()">🔄 续期 10 分钟</button>
            <button class="btn-danger" onclick="doLogout()">🚪 注销登录</button>
        </div>

        <div id="adminView" class="admin-panel hidden">
            <h3>👨‍💼 家长管理</h3>
            <div id="adminContent">正在加载...</div>
        </div>
    </div>

    <div class="admin-link" onclick="adminClick()">v1.0.0</div>

    <script>
        let token = localStorage.getItem("token");
        let adminClicks = 0;

        if (token) checkSession();

        async function doLogin() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const duration = document.getElementById("duration").value;
            const res = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password, duration})
            });
            const data = await res.json();
            if (data.ok) {
                token = data.token;
                localStorage.setItem("token", token);
                showAuth(data.expire);
            } else {
                document.getElementById("msg").textContent = data.msg;
            }
        }

        async function checkSession() {
            const res = await fetch("/api/check", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token})
            });
            const data = await res.json();
            if (data.ok) showAuth(data.expire);
            else localStorage.removeItem("token");
        }

        function showAuth(expireTs) {
            document.getElementById("loginView").classList.add("hidden");
            document.getElementById("authView").classList.remove("hidden");
            startCountdown(expireTs);
        }

        function startCountdown(expireTs) {
            const el = document.getElementById("countdown");
            const timer = setInterval(() => {
                const left = expireTs - Math.floor(Date.now()/1000);
                if (left <= 0) {
                    clearInterval(timer);
                    el.textContent = "00:00";
                    localStorage.removeItem("token");
                    setTimeout(() => location.reload(), 1500);
                    return;
                }
                const m = Math.floor(left/60), s = left%60;
                el.textContent = String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
            }, 1000);
        }

        async function doRenew() {
            const res = await fetch("/api/renew", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token, extra: 10})
            });
            const data = await res.json();
            if (data.ok) { alert("✅ 已续期 10 分钟！"); location.reload(); }
        }

        async function doLogout() {
            await fetch("/api/logout", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({token})
            });
            localStorage.removeItem("token");
            location.reload();
        }

        function adminClick() {
            adminClicks++;
            if (adminClicks >= 5) {
                const pwd = prompt("请输入家长管理密码：");
                if (pwd === "Parent@2026") {
                    document.getElementById("adminView").classList.remove("hidden");
                    loadAdmin();
                } else if (pwd !== null) {
                    alert("密码错误！");
                }
                adminClicks = 0;
            }
        }

        async function loadAdmin() {
            const [sessions, devices, logs] = await Promise.all([
                fetch("/api/admin/sessions").then(r=>r.json()),
                fetch("/api/admin/devices").then(r=>r.json()),
                fetch("/api/admin/logs").then(r=>r.json())
            ]);
            let html = `<p>在线会话: ${Object.keys(sessions).length}</p>
                        <p>已知设备: ${Object.keys(devices).length}</p><p>最近日志:</p>`;
            const entries = Object.entries(logs).sort((a,b) => b[1].ts - a[1].ts).slice(0, 10);
            for (const [, v] of entries) {
                const time = new Date(v.ts*1000).toLocaleString("zh-CN");
                html += `<div class="log-entry">[${time}] ${v.action}: ${v.detail}</div>`;
            }
            document.getElementById("adminContent").innerHTML = html;
        }
    </script>
</body>
</html>
