name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (check syntax)
        run: python -m py_compile app.py

      - name: Import test
        run: python -c "import app; print('import ok')"

      - name: Run smoke tests
        run: |
          if [ -f test_smoke.py ]; then
            python test_smoke.py
          else
            echo "no tests yet"
          fi

      - name: Package artifact
        run: |
          mkdir -p dist
          zip -r dist/kids-gateway.zip app.py requirements.txt templates README.md

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: kids-gateway-build
          path: dist/kids-gateway.zip
